name: notifier

# The broker lives in the shelter repo's compose file and is shared; this app dials it
# on localhost:9092. Its database, though, is its own — declared here so the notifier
# can be started without cloning the shelter, and so the shelter's `down -v` cannot
# wipe it.
services:
  postgres:
    image: postgres:17
    container_name: notifier-postgres
    environment:
      POSTGRES_DB: notifier
      POSTGRES_USER: notifier
      POSTGRES_PASSWORD: notifier
    ports:
      - "5433:5432"        # 5432 is taken by the shelter's database
    volumes:
      - notifier_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "notifier"]
      interval: 10s
      timeout: 5s
      retries: 5

  # A mail catcher, not a mail server: it accepts everything the digest sends and delivers
  # none of it, so alerts can be read at http://localhost:8025 without a real mailbox. In
  # production MAIL_HOST and MAIL_PORT point at an actual relay instead.
  # The tests do not use this — they run GreenMail inside the JVM.
  mailpit:
    image: axllent/mailpit
    container_name: notifier-mailpit
    ports:
      - "1025:1025"        # SMTP, the port application.properties dials by default
      - "8025:8025"        # web UI, where the digests can be read
    restart: unless-stopped

volumes:
  notifier_data:
