spring.application.name=notifier

# No web server — this app only listens to Kafka.
spring.main.web-application-type=none

# --- Datasource (the notifier's own database, not the shelter's) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:notifier}
spring.datasource.username=${DB_USER:notifier}
spring.datasource.password=${DB_PASSWORD:notifier}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=notifier
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
shelter.kafka.replicas=${KAFKA_REPLICAS:1}

# --- Health alert digest ---
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
notifier.digest.from=notifier@shelter.local
notifier.digest.to=${DIGEST_RECIPIENT:vet@shelter.local}
# How long an alert can sit unsent. Low enough to be useful, high enough that a quiet shelter
# is not querying the table every second.
notifier.digest.interval=60000
# A moment's grace at startup, so the first digest does not race the Kafka listeners into a
# half-warm application. Also the knob tests turn up to stop the scheduler firing under them.
notifier.digest.initial-delay=10000
# One mail covers at most this many alerts; the rest wait for the next tick rather than
# producing a mail nobody will read to the end.
notifier.digest.batch-size=50
