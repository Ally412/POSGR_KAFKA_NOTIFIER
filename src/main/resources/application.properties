spring.application.name=notifier

# No web server — this app only listens to Kafka.
spring.main.web-application-type=none

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# Every consumer belongs to a named group; the broker remembers this group's read position,
# so a restart resumes where it left off. Rename it and the topic replays from the start.
spring.kafka.consumer.group-id=notifier
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.value.default.type=io.github.ally412.notifier.AnimalAdded
spring.kafka.consumer.properties.spring.json.trusted.packages=io.github.ally412.notifier
# Producer serializers are set on the KafkaTemplate bean, not here — the value one needs a
# map of type-to-serializer, which a property cannot express. This line is documentation.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# Replication factor for the dead letter topic: 1 locally, override in a real cluster.
shelter.kafka.replicas=${KAFKA_REPLICAS:1}
